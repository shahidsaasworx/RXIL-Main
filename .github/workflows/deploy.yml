name: PR Validation

on:
  pull_request:
    branches: [main, uat, qa]

jobs:
  resolve-env:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.map.outputs.environment }}
    steps:
      - id: map
        shell: bash
        run: |
          case "${{ github.base_ref }}" in
            qa) echo "environment=qa" >> "$GITHUB_OUTPUT" ;;
            uat) echo "environment=uat" >> "$GITHUB_OUTPUT" ;;
            main) echo "environment=production" >> "$GITHUB_OUTPUT" ;;
          esac

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run prettier:verify
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit:coverage

  validate:
    needs: [resolve-env, quality]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Authenticate to Salesforce
        uses: ./.github/actions/setup-sfdx
        with:
          client-id: ${{ secrets.SF_CLIENT_ID }}
          jwt-key: ${{ secrets.SF_JWT_KEY }}
          username: ${{ secrets.SF_USERNAME }}
          instance-url: ${{ secrets.SF_INSTANCE_URL }}
      - name: Generate source delta
        run: |
         mkdir -p delta
         sf sgd source delta \
         --to HEAD \
          --from "origin/${{ github.base_ref }}" \
          --output-dir delta \
          --source-dir force-app
        
      - name: Validate deployment
      run: |
          if [ ! -f delta/package/package.xml ]; then
            echo "No Salesforce metadata changes detected — skipping validation."
            exit 0
          fi
          sf project deploy validate \
            --manifest delta/package/package.xml \
            --test-level RunLocalTests \
            --wait 60
